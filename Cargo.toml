[workspace]
members = [
    "crates/flashbrowse-bidi",
    "crates/flashbrowse-cdp",
    "crates/flashbrowse-core",
    "crates/flashbrowse-mcp",
    "crates/flashbrowse-cli",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.40", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "io-std",
    "net",
    "process",
    "sync",
    "time",
    "fs",
    "signal",
] }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
rustix = { version = "1.1", features = ["process"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# Only the flate2 DEFLATE decoder is enabled. flashbrowse reads ZIP archives
# and never compresses them, so the Zopfli encoder is unnecessary.
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }
flate2 = "1.1"
tar = { version = "0.4", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
which = "7.0"
dashmap = "6.1"
async-trait = "0.1"
url = "2.5"

[workspace.package]
version = "1.5.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nhrbuilds/flashbrowse"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
panic = "unwind"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
